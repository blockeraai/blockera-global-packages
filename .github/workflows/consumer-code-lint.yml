# Reusable workflow — called from consumer thin `.github/workflows/code-lint.yml`.
# Job graph lives here; consumers only keep triggers + repository guard + secrets.
name: Consumer Code Lint

on:
    workflow_call:
        inputs:
            config-path:
                description: 'Path to consumer blockera-ci.json'
                type: string
                required: false
                default: '.github/blockera-ci.json'
            php-version:
                description: 'PHP version for PHPCS job'
                type: string
                required: false
                default: '7.4'
        secrets:
            BLOCKERABOT_PAT:
                description: 'PAT with read access to blockera-global-packages'
                required: true

permissions:
    contents: read
    pull-requests: write

jobs:
    jslint:
        name: JavaScript coding standards
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout consumer repository
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule (sparse)
              env:
                  BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
              run: bash .github/scripts/ensure-global-packages-sparse.sh "${GITHUB_WORKSPACE}"

            - name: Setup Node.js and install dependencies
              uses: ./packages/dev-tools/github/actions/setup-node

            - name: Lint JS
              uses: ./packages/dev-tools/github/actions/code-lint
              with:
                  suite: js
                  config-path: ${{ inputs.config-path }}

    stylelint:
        name: CSS coding standards
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout consumer repository
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule (sparse)
              env:
                  BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
              run: bash .github/scripts/ensure-global-packages-sparse.sh "${GITHUB_WORKSPACE}"

            - name: Setup Node.js and install dependencies
              uses: ./packages/dev-tools/github/actions/setup-node

            - name: Lint CSS
              uses: ./packages/dev-tools/github/actions/code-lint
              with:
                  suite: css
                  config-path: ${{ inputs.config-path }}

    phpcs:
        name: PHP coding standards
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout consumer repository
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule (sparse)
              env:
                  BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
              run: bash .github/scripts/ensure-global-packages-sparse.sh "${GITHUB_WORKSPACE}"

            - name: Setup PHP Composer install dependencies
              uses: ./packages/dev-tools/github/actions/setup-php
              with:
                  php-version: ${{ inputs.php-version }}

            - name: Lint PHP
              uses: ./packages/dev-tools/github/actions/code-lint
              with:
                  suite: php
                  config-path: ${{ inputs.config-path }}
