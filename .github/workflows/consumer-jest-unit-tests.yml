# Reusable workflow — called from consumer thin `.github/workflows/jest-unit-tests.yml`.
# Job graph lives here; consumers only keep triggers + repository guard + secrets.
name: Consumer Jest unit tests

on:
    workflow_call:
        inputs:
            config-path:
                description: 'Path to consumer blockera-ci.json'
                type: string
                required: false
                default: '.github/blockera-ci.json'
            node-version:
                description: 'Node.js version for the Jest job matrix entry'
                type: string
                required: false
                default: '18.3.0'
        secrets:
            BLOCKERABOT_PAT:
                description: 'PAT with read access to blockera-global-packages'
                required: true

permissions:
    contents: read

jobs:
    unit-js:
        name: JavaScript
        runs-on: ubuntu-latest
        steps:
            - name: Checkout consumer repository
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule (sparse)
              env:
                  BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
              run: bash .github/scripts/ensure-global-packages-sparse.sh "${GITHUB_WORKSPACE}"

            # Resolved from this reusable-workflow repo (GP), not the consumer tree.
            - name: Setup Node.js and install dependencies
              uses: ./packages/dev-tools/github/actions/setup-node
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Jest unit tests
              uses: ./packages/dev-tools/github/actions/jest-unit-tests
              with:
                  config-path: ${{ inputs.config-path }}
