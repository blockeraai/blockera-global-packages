name: Notify consumers submodule sync

# After Update Changelogs finishes on master (PR merge fold, or that workflow’s
# manual dispatch). Consumers are listed in .github/global-packages-consumers.json.
# Pin SHA is origin/master tip so a fold commit is included when one was pushed.
# The changelog bot’s own push is not a merge, so this does not dispatch twice.
on:
    workflow_run:
        workflows:
            - Update Changelogs
        types:
            - completed
        branches:
            - master

concurrency:
    group: notify-consumers-master
    cancel-in-progress: true

jobs:
    resolve-consumers:
        name: Resolve consumer matrix
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'blockeraai/blockera-global-packages' && github.event.workflow_run.conclusion == 'success' }}
        outputs:
            matrix: ${{ steps.build.outputs.matrix }}
            should_run: ${{ steps.pin.outputs.should_run }}
            sha: ${{ steps.pin.outputs.sha }}
            ref: ${{ steps.pin.outputs.ref }}
            branch: ${{ steps.pin.outputs.branch }}
            message: ${{ steps.pin.outputs.message }}
        steps:
            - name: Checkout master
              uses: actions/checkout@v5
              with:
                  ref: master
                  fetch-depth: 0
                  sparse-checkout: |
                      .github/global-packages-consumers.json
                  sparse-checkout-cone-mode: false

            - name: Resolve pin SHA
              id: pin
              env:
                  TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
                  TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
              run: |
                  set -euo pipefail
                  git fetch origin master
                  PIN_SHA="$(git rev-parse origin/master)"
                  should_run=false

                  if [ "${TRIGGER_EVENT}" = "workflow_dispatch" ]; then
                    should_run=true
                  elif [ -n "${TRIGGER_SHA}" ] && git rev-parse -q --verify "${TRIGGER_SHA}^2" >/dev/null; then
                    should_run=true
                  else
                    echo "Skip notify: Update Changelogs did not run on a master merge (or that workflow’s dispatch)."
                  fi

                  {
                    echo "should_run=${should_run}"
                    echo "sha=${PIN_SHA}"
                    echo "ref=refs/heads/master"
                    echo "branch=master"
                    echo "message<<MSG"
                    git log -1 --format=%B "${PIN_SHA}"
                    echo "MSG"
                  } >> "${GITHUB_OUTPUT}"

            - name: Build matrix from consumers.json
              id: build
              run: |
                  set -euo pipefail
                  MATRIX="$(jq -c '{ include: [ .consumers[] | select(.enabled != false) | { repository } ] }' .github/global-packages-consumers.json)"
                  COUNT="$(echo "${MATRIX}" | jq '.include | length')"
                  if [[ "${COUNT}" -eq 0 ]]; then
                    echo "No enabled consumers in .github/global-packages-consumers.json" >&2
                    exit 1
                  fi
                  echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
                  if [[ "${{ steps.pin.outputs.should_run }}" == "true" ]]; then
                    echo "Dispatching ${PIN_SHA} to ${COUNT} consumer(s):"
                    echo "${MATRIX}" | jq -r '.include[].repository'
                  fi
              env:
                  PIN_SHA: ${{ steps.pin.outputs.sha }}

    notify:
        name: repository_dispatch → ${{ matrix.repository }}
        needs: resolve-consumers
        if: ${{ needs.resolve-consumers.outputs.should_run == 'true' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.resolve-consumers.outputs.matrix) }}

        steps:
            - name: Dispatch global-packages-updated
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  repository: ${{ matrix.repository }}
                  event-type: global-packages-updated
                  client-payload: |-
                      {
                        "sha": "${{ needs.resolve-consumers.outputs.sha }}",
                        "ref": "${{ needs.resolve-consumers.outputs.ref }}",
                        "branch": "${{ needs.resolve-consumers.outputs.branch }}",
                        "message": ${{ toJSON(needs.resolve-consumers.outputs.message) }},
                        "source_repository": "${{ github.repository }}"
                      }
