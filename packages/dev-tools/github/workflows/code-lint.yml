# Thin caller template — copy to consumer `.github/workflows/code-lint.yml`
# Replace OWNER/REPO and WORKFLOWS_REF (GP ref with consumer-code-lint.yml).
name: Code Lint

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    lint:
        name: Code lint
        if: ${{ github.repository == 'OWNER/REPO' || github.event_name == 'pull_request' }}
        uses: blockeraai/blockera-global-packages/.github/workflows/consumer-code-lint.yml@WORKFLOWS_REF
        secrets:
            BLOCKERABOT_PAT: ${{ secrets.BLOCKERABOT_PAT }}
        with:
            config-path: .github/blockera-ci.json
