# Template — Blockera plugin is the base. Copy to consumer and change OWNER/REPO.
# Consumers pass discovery filters via BLOCKERA_PLAYWRIGHT_* env (package suffix, exclude files, …).
name: Playwright E2E Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

env:
    VISUAL_SNAPSHOT_BATCH_SIZE: '15'
    # BLOCKERA_PLAYWRIGHT_PACKAGE_SUFFIX: -one
    # BLOCKERA_PLAYWRIGHT_PACKAGE_PREFIX: blockera-one-
    # BLOCKERA_PLAYWRIGHT_EXCLUDE_FILES: tests/visual.block-screenshots.ply.js
    # BLOCKERA_PLAYWRIGHT_MU_PLUGIN_PREFIX: wp-content/themes/blockera-one/

jobs:
    detect_categories:
        name: Detecting Playwright E2E Test Categories
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            categories: ${{ steps.detect.outputs.categories }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - id: detect
              run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/playwright-e2e-tests/detect-categories.sh

    playwright_e2e_tests:
        name: Test
        needs: detect_categories
        runs-on: ubuntu-latest
        timeout-minutes: 60
        if: ${{ github.repository == 'OWNER/REPO' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                category: ${{ fromJson(needs.detect_categories.outputs.categories) }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_PLAYWRIGHT_CATEGORY: ${{ matrix.category }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/playwright-e2e-tests/run.sh

            - name: Collect new visual baselines
              if: ${{ !cancelled() }}
              run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/playwright-e2e-tests/collect-baselines.sh

            - name: Archive debug artifacts (screenshots, traces)
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-artifacts--${{ matrix.category }}
                  path: |
                      artifacts/test-results
                      artifacts/new-baselines
                      playwright-report
                  if-no-files-found: ignore
                  retention-days: 7
