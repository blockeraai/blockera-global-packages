# Template — Blockera plugin is the base. Copy to consumer and change OWNER/REPO.
# Pro example: files: ./blockera-pro.zip + ./
name: Virus Total Scan

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    build:
        name: Building and Scan Files
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'OWNER/REPO' || github.event_name == 'pull_request' }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/virus-total
              with:
                  vt-api-key: ${{ secrets.VT_API_KEY }}
                  # files: |
                  #     ./blockera-pro.zip
                  #     ./
