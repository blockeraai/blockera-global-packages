# Template — Blockera plugin is the base. Copy to consumer and change file-paths / token as needed.
# Pro example: file-paths: blockera-pro.php, checkout ref: develop, token: BLOCKERABOT_PAT
name: 'WP "Tested up to" Check'

on:
    schedule:
        - cron: '0 0 * * 0'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    tut-check:
        name: Check for new "Tested up to" version
        runs-on: ubuntu-latest
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  # ref: develop

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/wp-tested-up-to-update
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  # file-paths: blockera-pro.php
