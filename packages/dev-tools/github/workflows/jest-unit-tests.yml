# Thin caller template — copy to consumer `.github/workflows/jest-unit-tests.yml`
# Replace OWNER/REPO. Pin WORKFLOWS_REF to a GP commit/tag/branch that contains
# `.github/workflows/consumer-jest-unit-tests.yml` (prefer a SHA or tag in prod).
name: JavaScript Unit Tests (By Jest)

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    unit-js:
        name: JavaScript
        if: ${{ github.repository == 'OWNER/REPO' || github.event_name == 'pull_request' }}
        uses: blockeraai/blockera-global-packages/.github/workflows/consumer-jest-unit-tests.yml@WORKFLOWS_REF
        secrets:
            BLOCKERABOT_PAT: ${{ secrets.BLOCKERABOT_PAT }}
        with:
            config-path: .github/blockera-ci.json
