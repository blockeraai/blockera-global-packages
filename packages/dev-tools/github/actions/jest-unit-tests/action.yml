name: 'Blockera Jest unit tests'
description: 'Build (optional) and run Jest using defaults + consumer .github/blockera-ci.json'
inputs:
    config-path:
        description: 'Path to consumer blockera-ci.json'
        required: false
        default: '.github/blockera-ci.json'

runs:
    using: 'composite'
    steps:
        - name: Resolve Jest settings from merged CI config
          id: cfg
          shell: bash
          env:
              CONFIG_PATH: ${{ inputs.config-path }}
          run: |
              set -euo pipefail
              LOADER="${GITHUB_WORKSPACE}/packages/global-packages/packages/dev-tools/github/scripts/load-ci-config.js"

              COMMAND="$(node "${LOADER}" "${CONFIG_PATH}" --get test.jest.command)"
              BUILD_COMMAND="$(node "${LOADER}" "${CONFIG_PATH}" --get test.jest.buildCommand)"
              RUN_BUILD="$(node "${LOADER}" "${CONFIG_PATH}" --get test.jest.build)"
              RUN_COMPOSER="$(node "${LOADER}" "${CONFIG_PATH}" --get test.jest.composerInstall)"
              COMPOSER_COMMAND="$(node "${LOADER}" "${CONFIG_PATH}" --get test.jest.composerCommand)"

              {
                echo "command<<EOF"
                printf '%s\n' "${COMMAND}"
                echo "EOF"
                echo "build_command<<EOF"
                printf '%s\n' "${BUILD_COMMAND}"
                echo "EOF"
                echo "run_build=${RUN_BUILD}"
                echo "run_composer=${RUN_COMPOSER}"
                echo "composer_command<<EOF"
                printf '%s\n' "${COMPOSER_COMMAND}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"

        - name: Install Composer packages
          if: ${{ steps.cfg.outputs.run_composer == 'true' }}
          shell: bash
          run: ${{ steps.cfg.outputs.composer_command }}

        - name: Build
          if: ${{ steps.cfg.outputs.run_build == 'true' }}
          shell: bash
          run: ${{ steps.cfg.outputs.build_command }}

        - name: Run Jest
          shell: bash
          run: ${{ steps.cfg.outputs.command }}
