name: 'Blockera Jest unit tests'
description: 'Build (optional) and run Jest using consumer .github/blockera-ci.json'
inputs:
    config-path:
        description: 'Path to consumer blockera-ci.json'
        required: false
        default: '.github/blockera-ci.json'

runs:
    using: 'composite'
    steps:
        - name: Resolve Jest settings from consumer config
          id: cfg
          shell: bash
          env:
              CONFIG_PATH: ${{ inputs.config-path }}
          run: |
              set -euo pipefail
              if [[ ! -f "${CONFIG_PATH}" ]]; then
                echo "Missing consumer config: ${CONFIG_PATH}" >&2
                exit 1
              fi

              EVAL="$(node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
                const jest = (cfg.test && cfg.test.jest) || {};
                const out = {
                  command: jest.command || "npm run test:js -- --ci --maxWorkers=2 --cacheDirectory=\"$HOME/.jest-cache\"",
                  build_command: jest.buildCommand || "npm run build",
                  run_build: jest.build === false ? "false" : "true",
                  run_composer: jest.composerInstall === true ? "true" : "false",
                  composer_command: jest.composerCommand || "composer install --no-dev -o --apcu-autoloader -a",
                };
                process.stdout.write(JSON.stringify(out));
              ')"

              COMMAND="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).command)' "${EVAL}")"
              BUILD_COMMAND="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).build_command)' "${EVAL}")"
              RUN_BUILD="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).run_build)' "${EVAL}")"
              RUN_COMPOSER="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).run_composer)' "${EVAL}")"
              COMPOSER_COMMAND="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).composer_command)' "${EVAL}")"

              {
                echo "command<<EOF"
                printf '%s\n' "${COMMAND}"
                echo "EOF"
                echo "build_command<<EOF"
                printf '%s\n' "${BUILD_COMMAND}"
                echo "EOF"
                echo "run_build=${RUN_BUILD}"
                echo "run_composer=${RUN_COMPOSER}"
                echo "composer_command<<EOF"
                printf '%s\n' "${COMPOSER_COMMAND}"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"

        - name: Install Composer packages
          if: ${{ steps.cfg.outputs.run_composer == 'true' }}
          shell: bash
          run: ${{ steps.cfg.outputs.composer_command }}

        - name: Build
          if: ${{ steps.cfg.outputs.run_build == 'true' }}
          shell: bash
          run: ${{ steps.cfg.outputs.build_command }}

        - name: Run Jest
          shell: bash
          run: ${{ steps.cfg.outputs.command }}
