name: 'Setup PHP and install Composer dependencies'
description: >
    Shared PHP/Composer setup for Blockera consumers. Call after checkout +
    ensure-global-packages-sparse.sh so this action path exists under
    packages/global-packages/packages/dev-tools/github/actions/setup-php.
inputs:
    php-version:
        description: 'PHP version for the runner (and composer platform.php).'
        required: false
        default: '7.4'
    composer-options:
        description: 'Extra options passed to composer install.'
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: '${{ inputs.php-version }}'
              ini-file: development
              coverage: none
              tools: cs2pr
              ini-values: memory_limit=128M, max_execution_time=30, max_input_time=60, max_input_vars=1000

        - name: Override PHP version in composer.json
          shell: bash
          run: composer config platform.php ${{ inputs.php-version }}

        - name: Remove wp-cli bundle from composer.json
          shell: bash
          run: |
              if [[ ! -f composer.json ]]; then
                  exit 0
              fi
              if ! jq -e '.["require-dev"]["wp-cli/wp-cli-bundle"]' composer.json >/dev/null 2>&1; then
                  exit 0
              fi
              tmp=$(mktemp)
              jq 'del(.["require-dev"]["wp-cli/wp-cli-bundle"])' composer.json >"$tmp"
              mv "$tmp" composer.json

        - name: Sync composer.lock after wp-cli removal
          shell: bash
          run: |
              if [[ ! -f composer.lock ]]; then
                  exit 0
              fi
              if ! rg -q '"name": "wp-cli/wp-cli-bundle"' composer.lock; then
                  exit 0
              fi
              composer remove wp-cli/wp-cli-bundle --dev --no-install || true

        - name: Install Composer dependencies
          uses: ramsey/composer-install@v4
          with:
              custom-cache-suffix: $(/bin/date -u --date='last Mon' "+%F")
              composer-options: '${{ inputs.composer-options }}'

        - name: Remove Composer wp-cli from vendor
          shell: bash
          run: bash packages/global-packages/packages/dev-tools/github/scripts/lib/remove-wp-cli-vendor.sh
