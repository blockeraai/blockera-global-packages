name: 'PR workflow gate'
description: >
    Skip pull_request runs when .pr-workflows.json allowedActions excludes this workflow file.
    Non-PR events always proceed. Requires checkout + ensure-global-packages before use.
inputs:
    workflow-file:
        description: 'Workflow filename (e.g. php-unit-tests.yml)'
        required: true
    force:
        description: 'Skip filter and always run (true|false)'
        required: false
        default: 'false'
outputs:
    run:
        description: 'true when this workflow should run'
        value: ${{ steps.gate.outputs.run }}
runs:
    using: 'composite'
    steps:
        - id: gate
          shell: bash
          env:
              BLOCKERA_PR_WORKFLOW_FILE: ${{ inputs.workflow-file }}
              BLOCKERA_PR_WORKFLOWS_FORCE: ${{ inputs.force }}
          run: bash "${GITHUB_WORKSPACE}/packages/global-packages/packages/dev-tools/github/scripts/jobs/pr-workflows/should-run.sh"
