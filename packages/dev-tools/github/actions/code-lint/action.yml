name: 'Blockera code lint'
description: 'Run js, css, or php lint using consumer .github/blockera-ci.json'
inputs:
    suite:
        description: 'Lint suite to run: js | css | php'
        required: true
    config-path:
        description: 'Path to consumer blockera-ci.json'
        required: false
        default: '.github/blockera-ci.json'

runs:
    using: 'composite'
    steps:
        - name: Resolve lint command from consumer config
          id: cfg
          shell: bash
          env:
              SUITE: ${{ inputs.suite }}
              CONFIG_PATH: ${{ inputs.config-path }}
          run: |
              set -euo pipefail
              if [[ ! -f "${CONFIG_PATH}" ]]; then
                echo "Missing consumer config: ${CONFIG_PATH}" >&2
                exit 1
              fi

              case "${SUITE}" in
                js|css|php) ;;
                *)
                  echo "Unsupported suite '${SUITE}' (expected js|css|php)" >&2
                  exit 1
                  ;;
              esac

              COMMAND="$(node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
                const suite = process.env.SUITE;
                const entry = cfg.lint && cfg.lint[suite];
                if (!entry || !entry.command) {
                  console.error("lint." + suite + ".command missing in " + process.env.CONFIG_PATH);
                  process.exit(1);
                }
                process.stdout.write(entry.command);
              ')"

              SCSS_ROOT="$(node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
                const entry = (cfg.lint && cfg.lint.css) || {};
                process.stdout.write(entry.scssRoot || "./packages");
              ')"

              SCSS_GLOB="$(node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
                const entry = (cfg.lint && cfg.lint.css) || {};
                process.stdout.write(entry.scssGlob || "*.scss");
              ')"

              REPORT_PATH="$(node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
                const entry = (cfg.lint && cfg.lint.php) || {};
                process.stdout.write(entry.reportPath || "./.cache/phpcs-report.xml");
              ')"

              {
                echo "command=${COMMAND}"
                echo "scss_root=${SCSS_ROOT}"
                echo "scss_glob=${SCSS_GLOB}"
                echo "report_path=${REPORT_PATH}"
              } >> "$GITHUB_OUTPUT"

        - name: Run JavaScript lint
          if: ${{ inputs.suite == 'js' }}
          shell: bash
          run: ${{ steps.cfg.outputs.command }}

        - name: Find SCSS files
          if: ${{ inputs.suite == 'css' }}
          id: find_scss
          shell: bash
          run: |
              count="$(find "${{ steps.cfg.outputs.scss_root }}" -name "${{ steps.cfg.outputs.scss_glob }}" 2>/dev/null | wc -l | tr -d ' ')"
              echo "file_count=${count}" >> "$GITHUB_OUTPUT"

        - name: Run CSS lint
          if: ${{ inputs.suite == 'css' && steps.find_scss.outputs.file_count != '0' }}
          shell: bash
          run: ${{ steps.cfg.outputs.command }}

        - name: Make Composer packages available globally
          if: ${{ inputs.suite == 'php' }}
          shell: bash
          run: echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

        - name: Run PHP lint
          if: ${{ inputs.suite == 'php' }}
          id: phpcs
          shell: bash
          run: |
              mkdir -p .cache
              ${{ steps.cfg.outputs.command }}

        - name: Show PHPCS results in PR
          if: ${{ inputs.suite == 'php' && always() && steps.phpcs.outcome == 'failure' }}
          shell: bash
          run: cs2pr "${{ steps.cfg.outputs.report_path }}"

        - name: Ensure version-controlled files are not modified
          if: ${{ inputs.suite == 'php' }}
          shell: bash
          run: git diff --exit-code
