name: 'Blockera code lint'
description: 'Run js, css, or php lint using defaults + consumer .github/blockera-ci.json'
inputs:
    suite:
        description: 'Lint suite to run: js | css | php'
        required: true
    config-path:
        description: 'Path to consumer blockera-ci.json'
        required: false
        default: '.github/blockera-ci.json'

runs:
    using: 'composite'
    steps:
        - name: Resolve lint command from merged CI config
          id: cfg
          shell: bash
          env:
              SUITE: ${{ inputs.suite }}
              CONFIG_PATH: ${{ inputs.config-path }}
          run: |
              set -euo pipefail
              case "${SUITE}" in
                js|css|php) ;;
                *)
                  echo "Unsupported suite '${SUITE}' (expected js|css|php)" >&2
                  exit 1
                  ;;
              esac

              LOADER="${GITHUB_WORKSPACE}/packages/global-packages/packages/dev-tools/github/scripts/load-ci-config.js"
              COMMAND="$(node "${LOADER}" "${CONFIG_PATH}" --get "lint.${SUITE}.command")"
              SCSS_ROOT="$(node "${LOADER}" "${CONFIG_PATH}" --get lint.css.scssRoot)"
              SCSS_GLOB="$(node "${LOADER}" "${CONFIG_PATH}" --get lint.css.scssGlob)"
              REPORT_PATH="$(node "${LOADER}" "${CONFIG_PATH}" --get lint.php.reportPath)"

              {
                echo "command=${COMMAND}"
                echo "scss_root=${SCSS_ROOT}"
                echo "scss_glob=${SCSS_GLOB}"
                echo "report_path=${REPORT_PATH}"
              } >> "$GITHUB_OUTPUT"

        - name: Run JavaScript lint
          if: ${{ inputs.suite == 'js' }}
          shell: bash
          run: ${{ steps.cfg.outputs.command }}

        - name: Find SCSS files
          if: ${{ inputs.suite == 'css' }}
          id: find_scss
          shell: bash
          run: |
              count="$(find "${{ steps.cfg.outputs.scss_root }}" -name "${{ steps.cfg.outputs.scss_glob }}" 2>/dev/null | wc -l | tr -d ' ')"
              echo "file_count=${count}" >> "$GITHUB_OUTPUT"

        - name: Run CSS lint
          if: ${{ inputs.suite == 'css' && steps.find_scss.outputs.file_count != '0' }}
          shell: bash
          run: ${{ steps.cfg.outputs.command }}

        - name: Make Composer packages available globally
          if: ${{ inputs.suite == 'php' }}
          shell: bash
          run: echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

        - name: Run PHP lint
          if: ${{ inputs.suite == 'php' }}
          id: phpcs
          shell: bash
          run: |
              mkdir -p .cache
              ${{ steps.cfg.outputs.command }}

        - name: Show PHPCS results in PR
          if: ${{ inputs.suite == 'php' && always() && steps.phpcs.outcome == 'failure' }}
          shell: bash
          run: cs2pr "${{ steps.cfg.outputs.report_path }}"

        - name: Ensure version-controlled files are not modified
          if: ${{ inputs.suite == 'php' }}
          shell: bash
          run: git diff --exit-code
